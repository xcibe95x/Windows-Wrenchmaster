[package]
name = "wrenchmaster"
version = "2.0.0"
edition = "2024"
description = "Windows Wrenchmaster - a modern, offline Windows maintenance toolbox"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.35.0"
egui_plot = "0.36.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde_json = "1.0"
sysinfo = "0.38.4"
walkdir = "2.5.0"
winreg = "0.56.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
] }

# Windows resource metadata (icon, version, manifest). Build-time only, and
# the build script skips it on any other target.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
